[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "astrologer-api"
version = "6.0.0"
description = "FastAPI service for astrological calculations and charts"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "starlette",
    "fastapi",
    "uvicorn",
    "tzdata>=2025.2",
    "scour",
    "typing-extensions",
    "pyjwt>=2.10.1",
    "mcp[cli]",
    "kerykeion @ git+https://github.com/g-battaglia/kerykeion@64ef9db02b9343d1c0264ee6c3fb61ab900ab240",
    "libephemeris @ git+https://github.com/g-battaglia/libephemeris@23c9f994daeb66a99acb89dd912157e4a5c2f463",
]

[project.optional-dependencies]
postgres = [
    "libephemeris-postgres @ git+https://github.com/g-battaglia/libephemeris@23c9f994daeb66a99acb89dd912157e4a5c2f463#subdirectory=packages/libephemeris-postgres",
]

[tool.setuptools]
packages = ["app", "app.config", "app.mcp", "app.mcp.tools", "app.middleware", "app.routers", "app.types", "app.types.request_domains", "app.types.response_domains", "app.utils"]
package-dir = {app = "."}
include-package-data = false

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["F", "ISC001"]
